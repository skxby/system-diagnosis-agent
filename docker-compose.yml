# Log Intelligence Agent V1 —— 单机全栈编排（计划第 996-1003 行）
#
#   docker compose up -d            一键起全栈
#   docker compose ps               看健康状态
#   docker compose logs -f web      看应用日志（JSON 行，含 trace_id）
#   docker compose down             停止（数据卷保留）
#   docker compose down -v          停止并清空数据
#
# 两条刻意的设计：
#   1. **迁移走独立的 migrate 服务**（跑完即退出），web/worker/beat 都等它成功。
#      若让三个容器各自启动时跑迁移，会并发执行同一批 DDL —— 结果取决于运气。
#   2. **所有端口只绑 127.0.0.1**，与「只读 + 本地」的定位一致。
#
# 密钥只在运行时注入：compose 读同目录的 .env（已被 .dockerignore / .gitignore
# 挡住，不会进镜像也不会进 Git）。

name: logagent

x-app-image: &app-image
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  build:
    context: .
    dockerfile: Dockerfile
  image: logagent-app:local
  env_file:
    - .env
  environment:
    UPLOAD_QUEUE: uploads
    # 容器内用服务名互相寻址；.env 里的 127.0.0.1 是给宿主机直跑用的
    DATABASE_URL: postgresql+psycopg://logagent:${POSTGRES_PASSWORD:-logagent_dev_pw}@postgres:5432/logagent
    REDIS_URL: redis://redis:6379/0
    # uploads/ 与 data/ 都落在卷里，容器重建不丢数据
    DATA_DIR: /app/data
    TZ: UTC
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  # ---------- 基础设施 ----------
  postgres:
    logging: *default-logging
    image: postgres:15-alpine
    container_name: logagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: logagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logagent_dev_pw}
      POSTGRES_DB: logagent
      # 容器内统一 UTC；应用层自己按 DEFAULT_TIMEZONE 解析后再转 UTC
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logagent -d logagent"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: logagent-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ---------- 迁移（跑完即退出）----------
  migrate:
    <<: *app-image
    container_name: logagent-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://logagent:${POSTGRES_PASSWORD:-logagent_dev_pw}@postgres:5432/logagent
      TZ: UTC

  # ---------- 应用 ----------
  web:
    <<: *app-image
    container_name: logagent-web
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    ports:
      # 只绑回环：本机访问 http://127.0.0.1:8000
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - appdata:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  worker:
    # Supervisor 在子进程中启动 Celery -P solo，并监督整个进程树。
    <<: *app-image
    container_name: logagent-worker
    restart: unless-stopped
    command: [python, -m, app.worker_supervisor, --role, analysis, --queues, celery]
    healthcheck:
      test: [CMD, python, -m, app.worker_supervisor, --health, --role, analysis]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - appdata:/app/data

  beat:
    <<: *app-image
    container_name: logagent-beat
    restart: unless-stopped
    command: [celery, -A, app.celery_app, beat, --scheduler, app.beat_scheduler:HealthScheduler, --max-interval, "5", --schedule, /app/data/celerybeat-schedule]
    healthcheck:
      test: [CMD, python, -m, app.worker_supervisor, --health, --role, beat]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - appdata:/app/data

  upload-worker:
    <<: *app-image
    restart: unless-stopped
    command: [python, -m, app.worker_supervisor, --role, uploads, --queues, uploads]
    volumes: [appdata:/app/data]
    healthcheck:
      test: [CMD, python, -m, app.worker_supervisor, --health, --role, uploads]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  maintenance-worker:
    <<: *app-image
    restart: unless-stopped
    command: [python, -m, app.worker_supervisor, --role, maintenance, --queues, maintenance]
    volumes: [appdata:/app/data]
    healthcheck:
      test: [CMD, python, -m, app.worker_supervisor, --health, --role, maintenance]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  # uploads/ 与 data/ 共用同一个卷：web 写入的脱敏文件，worker 分析时要能读到
  appdata:

{% extends "base.html" %}
{% block title %}登录{% endblock %}

{% block content %}
<div class="card" style="max-width:420px;margin:60px auto">
  <h2>登录</h2>

  <div id="login-error" class="banner banner-error" hidden></div>

  <label>
    <span>邮箱</span>
    <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
  </label>
  <label>
    <span>口令</span>
    <input id="password" type="password" autocomplete="current-password">
  </label>

  <div class="row mt">
    <button class="primary" id="login-btn">登录</button>
    <button class="link" id="register-btn" type="button">首次使用？注册这个邮箱</button>
  </div>

  <p class="muted small mt">
    首次使用请创建本机账号；已有账号请登录。默认只允许首次初始化时注册。
  </p>
</div>
{% endblock %}

{% block scripts %}
<script>
const errorBox = document.getElementById('login-error');
function fail(message) { errorBox.textContent = message; errorBox.hidden = false; }

async function submit(register) {
  errorBox.hidden = true;
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { fail('请填写邮箱与口令'); return; }

  try {
    await API.post(register ? '/api/register' : '/api/login', { email, password });
    if (register) {
      // 注册不设 Cookie，紧接着登录一次
      await API.post('/api/login', { email, password });
    }
    const next = queryParam('next') || '/projects';
    const target = new URL(next, location.origin);
    location.href = target.origin === location.origin ? target.pathname + target.search : '/projects';
  } catch (error) {
    fail(error.message);
  }
}

document.getElementById('login-btn').addEventListener('click', () => submit(false));
document.getElementById('register-btn').addEventListener('click', () => submit(true));
document.getElementById('password').addEventListener('keydown', (event) => {
  if (event.key === 'Enter') submit(false);
});
</script>
{% endblock %}
